# Detection rules for FortiGate key=value logs (format seen in the dev sample).
# seen_in_sample: true  -> the pattern was observed in the sample lines
# seen_in_sample: false -> written from FortiOS conventions, VERIFY against the full sample / ground truth
# Fields: srcip/dstip become src_ip/dst_ip; src_net24 is derived (e.g. 45.74.28.0/24).
# where ops: is_private | not_private | >N | <N | eq:X | ne:X | in:a,b | contains:X

# kill_chain = the 5 XDR kill chain stages shown in the UI (Stellar-style loop).
# Credential Access maps to Initial Attempts because every credential attack in this data is external; make it Propagation for internal-source rules.
tactics:
  Reconnaissance:       {order: 1,  kill_chain: Initial Attempts}
  Initial Access:       {order: 2,  kill_chain: Initial Attempts}
  Execution:            {order: 3,  kill_chain: Persistent Foothold}
  Persistence:          {order: 4,  kill_chain: Persistent Foothold}
  Privilege Escalation: {order: 5,  kill_chain: Propagation}
  Defense Evasion:      {order: 6,  kill_chain: Persistent Foothold}
  Credential Access:    {order: 7,  kill_chain: Initial Attempts}
  Discovery:            {order: 8,  kill_chain: Exploration}
  Lateral Movement:     {order: 9,  kill_chain: Propagation}
  Collection:           {order: 10, kill_chain: Exploration}
  Command and Control:  {order: 11, kill_chain: Persistent Foothold}
  Exfiltration:         {order: 12, kill_chain: Exfiltration & Impact}
  Impact:               {order: 13, kill_chain: Exfiltration & Impact}

rules:
  # Provider annotations are ingested as reported alerts, not independent proof.
  - id: R200
    name: 'Upstream EDR report: PowerShell execution (provider annotation)'
    type: match
    source: endpoint
    seen_in_sample: false
    prefilter: 'event="reported_alert"'
    match: 'event="reported_alert".* reported_action="suspicious_process_execution" reported_techniques="(?:[^"]*,)?T1059\.001(?:,[^"]*)?"'
    technique: T1059.001
    technique_name: PowerShell
    tactic: Execution
    weight: 7
  - id: R201
    name: 'Upstream EDR report: application beaconing (provider annotation)'
    type: match
    source: endpoint
    seen_in_sample: false
    prefilter: 'event="reported_alert"'
    match: 'event="reported_alert".* reported_action="suspicious_network_connection" reported_techniques="(?:[^"]*,)?T1071\.001(?:,[^"]*)?"'
    technique: T1071.001
    technique_name: Web Protocols
    tactic: Command and Control
    weight: 7
  - id: R202
    name: 'Upstream EDR report: brute force (provider annotation)'
    type: match
    source: endpoint
    seen_in_sample: false
    prefilter: 'event="reported_alert"'
    match: 'event="reported_alert".* reported_action="multiple_failed_logins" reported_techniques="(?:[^"]*,)?T1110(?:,[^"]*)?"'
    technique: T1110
    technique_name: Brute Force
    tactic: Credential Access
    weight: 5
  - id: R203
    name: 'Upstream EDR report: registry persistence (provider annotation)'
    type: match
    source: endpoint
    seen_in_sample: false
    prefilter: 'event="reported_alert"'
    match: 'event="reported_alert".* reported_action="registry_persistence" reported_techniques="(?:[^"]*,)?T1547\.001(?:,[^"]*)?"'
    technique: T1547.001
    technique_name: Registry Run Keys / Startup Folder
    tactic: Persistence
    weight: 7
  - id: R204
    name: 'Upstream EDR report: file encryption activity (provider annotation)'
    type: match
    source: endpoint
    seen_in_sample: false
    prefilter: 'event="reported_alert"'
    match: 'event="reported_alert".* reported_action="mass_file_rename" reported_techniques="(?:[^"]*,)?T1486(?:,[^"]*)?"'
    technique: T1486
    technique_name: Data Encrypted for Impact
    tactic: Impact
    weight: 9
  # ---- Firewall admin login attacks (type=event subtype=system) ----
  - id: R001
    name: Admin brute force on a valid account
    type: threshold
    seen_in_sample: false          # sample only shows reason=name_invalid; passwd_invalid is the FortiOS value for a wrong password
    prefilter: 'logdesc="Admin login failed"'
    match: 'logdesc="Admin login failed" user="(?P<user>[^"]*)" ui="[^"]*" method="\w+" srcip=(?P<src_ip>[\d.]+) srcintf="[^"]*" srcintfrole="[^"]*" dstip=(?P<dst_ip>[\d.]+) .*?reason="(?P<reason>[^"]*)"'
    where: {reason: "eq:passwd_invalid"}
    group_by: [src_ip, user]
    count: 20
    window: 300
    technique: T1110.001
    technique_name: Password Guessing
    tactic: Credential Access
    weight: 6

  - id: R002
    name: Password spraying (many usernames from one source IP)
    type: distinct_threshold
    seen_in_sample: false          # Per-IP variant; distributed /24 behavior remains R004.
    prefilter: 'logdesc="Admin login failed"'
    match: 'logdesc="Admin login failed" user="(?P<user>[^"]*)" ui="[^"]*" method="\w+" srcip=(?P<src_ip>[\d.]+) srcintf="[^"]*" srcintfrole="[^"]*" dstip=(?P<dst_ip>[\d.]+)'
    group_by: [src_ip]
    distinct: user
    count: 10
    window: 300
    technique: T1110.003
    technique_name: Password Spraying
    tactic: Credential Access
    weight: 3

  - id: R010
    name: Firewall admin login success from external IP
    type: match
    seen_in_sample: false          # FortiOS logdesc "Admin login successful"
    prefilter: 'logdesc="Admin login successful"'
    match: 'logdesc="Admin login successful" user="(?P<user>[^"]*)" ui="[^"]*" method="\w+" srcip=(?P<src_ip>[\d.]+) srcintf="[^"]*" srcintfrole="[^"]*" dstip=(?P<dst_ip>[\d.]+)'
    where: {src_ip: not_private}
    technique: T1078
    technique_name: Valid Accounts
    tactic: Initial Access
    weight: 7

  - id: R070
    name: Firewall configuration changed
    type: match
    seen_in_sample: false
    prefilter: 'logdesc="Attribute configured"'
    match: 'logdesc="Attribute configured" user="(?P<user>[^"]*)"'
    technique: T1562.004
    technique_name: Disable or Modify System Firewall
    tactic: Defense Evasion
    weight: 5

  - id: R071
    name: Admin account created on firewall
    type: match
    seen_in_sample: false
    prefilter: 'cfgpath="system.admin"'
    match: 'user="(?P<user>[^"]*)".*?cfgpath="system.admin".*?action="Add"'
    technique: T1136
    technique_name: Create Account
    tactic: Persistence
    weight: 7

  # ---- Network flows (type=traffic) ----
  - id: R020
    name: Port scan (many ports, one src/dst pair)
    type: distinct_threshold
    seen_in_sample: false
    prefilter: 'type="traffic"'
    match: 'srcip=(?P<src_ip>[\d.]+) srcport=\d+ srcintf="[^"]*" srcintfrole="[^"]*" dstip=(?P<dst_ip>[\d.]+) dstport=(?P<dst_port>\d+)'
    group_by: [src_ip, dst_ip]
    distinct: dst_port
    count: 15
    window: 60
    technique: T1046
    technique_name: Network Service Discovery
    tactic: Discovery
    weight: 3

  # No internal-to-internal flow appears in the sample (all LAN sources go to wan1),
  # so any internal-to-internal flow on an admin port is treated as lateral movement.
  - id: R031
    name: Internal RDP between hosts
    type: match
    seen_in_sample: false
    prefilter: 'type="traffic"'
    match: 'srcip=(?P<src_ip>[\d.]+) srcport=\d+ srcintf="[^"]*" srcintfrole="[^"]*" dstip=(?P<dst_ip>[\d.]+) dstport=(?P<dst_port>\d+)'
    where: {src_ip: is_private, dst_ip: is_private, dst_port: "eq:3389"}
    technique: T1021.001
    technique_name: Remote Desktop Protocol
    tactic: Lateral Movement
    weight: 5

  - id: R032
    name: Internal SMB between hosts
    type: match
    seen_in_sample: false
    prefilter: 'type="traffic"'
    match: 'srcip=(?P<src_ip>[\d.]+) srcport=\d+ srcintf="[^"]*" srcintfrole="[^"]*" dstip=(?P<dst_ip>[\d.]+) dstport=(?P<dst_port>\d+)'
    where: {src_ip: is_private, dst_ip: is_private, dst_port: "in:445,139"}
    technique: T1021.002
    technique_name: SMB/Windows Admin Shares
    tactic: Lateral Movement
    weight: 5

  - id: R033
    name: Internal SSH between hosts
    type: match
    seen_in_sample: false
    prefilter: 'type="traffic"'
    match: 'srcip=(?P<src_ip>[\d.]+) srcport=\d+ srcintf="[^"]*" srcintfrole="[^"]*" dstip=(?P<dst_ip>[\d.]+) dstport=(?P<dst_port>\d+)'
    where: {src_ip: is_private, dst_ip: is_private, dst_port: "eq:22"}
    technique: T1021.004
    technique_name: SSH
    tactic: Lateral Movement
    weight: 4

  # sentbyte >= 100 MB (9+ digits). Sample background max is ~8.5 MB; re-tune from profile.py percentiles.
  - id: R040
    name: Potential exfiltration - large outbound transfer to external IP
    type: match
    seen_in_sample: false
    prefilter: 'sentbyte='
    match: 'srcip=(?P<src_ip>[\d.]+) srcport=\d+ srcintf="[^"]*" srcintfrole="[^"]*" dstip=(?P<dst_ip>[\d.]+) dstport=(?P<dst_port>\d+) .*?action="(?P<action>[^"]+)".*?sentbyte=(?P<bytes>\d{9,})'
    where: {src_ip: is_private, dst_ip: not_private, bytes: ">99999999", action: "in:accept,close,client-rst,server-rst"}
    technique: T1041
    technique_name: Exfiltration Over C2 Channel
    tactic: Exfiltration
    weight: 9

  # ---- DNS (type=utm subtype=dns) ----
  - id: R050
    name: Repeated DNS lookups of one domain (frequency heuristic)
    type: threshold
    seen_in_sample: false
    prefilter: 'subtype="dns"'
    match: 'srcip=(?P<src_ip>[\d.]+) .*?hostname="(?P<hostname>[^"]+)"'
    group_by: [src_ip, hostname]
    count: 30
    window: 3600
    technique: T1071.004
    technique_name: DNS
    tactic: Command and Control
    weight: 4

  - id: R051
    name: Very long DNS hostname (tunnelling)
    type: match
    seen_in_sample: false
    prefilter: 'subtype="dns"'
    match: 'srcip=(?P<src_ip>[\d.]+) .*?hostname="(?P<hostname>[^"]{40,})"'
    technique: T1071.004
    technique_name: DNS
    tactic: Command and Control
    weight: 5

  # ---- UTM security events ----
  - id: R060
    name: Malware download detected
    type: match
    seen_in_sample: true           # virus="W31/Driverless.TUV!tr" url="/download/setup.exe" from lookalike domains
    prefilter: 'subtype="virus"'
    match: 'srcip=(?P<src_ip>[\d.]+) .*?virus="(?P<virus>[^"]*)" hostname="(?P<hostname>[^"]*)" url="(?P<url>[^"]*)"'
    technique: T1105
    technique_name: Ingress Tool Transfer
    tactic: Command and Control
    weight: 4

  - id: R061
    name: IPS critical or high severity
    type: match
    seen_in_sample: true
    prefilter: 'subtype="ips"'
    match: 'srcip=(?P<src_ip>[\d.]+) .*?dstip=(?P<dst_ip>[\d.]+) .*?attack="(?P<attack>[^"]*)" attackid=\d+ severity="(?P<severity>\w+)"'
    where: {severity: "in:critical,high"}
    technique: T1190
    technique_name: Exploit Public-Facing Application
    tactic: Initial Access
    weight: 4

  - id: R062
    name: Phishing site reached (not blocked)
    type: match
    seen_in_sample: true           # noisy: appears often in the sample, keep weight low
    prefilter: 'subtype="webfilter"'
    match: 'srcip=(?P<src_ip>[\d.]+) .*?action="(?P<action>\w+)" .*?hostname="(?P<hostname>[^"]*)" url="[^"]*" catdesc="(?P<catdesc>[^"]*)"'
    where: {action: "eq:passthrough", catdesc: "contains:Phish"}
    technique: T1566.002
    technique_name: Spearphishing Link
    tactic: Initial Access
    weight: 2

  # Endpoint telemetry and requested behavioral coverage.
  - id: R004
    name: Distributed password spraying across one source /24
    type: distinct_threshold
    seen_in_sample: true
    prefilter: logdesc="Admin login failed"
    match: logdesc="Admin login failed" user="(?P<user>[^"]*)" ui="[^"]*" method="\w+" srcip=(?P<src_ip>[\d.]+) srcintf="[^"]*" srcintfrole="[^"]*" dstip=(?P<dst_ip>[\d.]+)
    group_by:
    - src_net24
    - dst_ip
    distinct: user
    count: 10
    window: 300
    technique: T1110.003
    technique_name: Password Spraying
    tactic: Credential Access
    weight: 3
  - id: R011
    name: Successful firewall admin login from internal host
    type: match
    seen_in_sample: false
    prefilter: logdesc="Admin login successful"
    match: logdesc="Admin login successful" user="(?P<user>[^"]*)" ui="[^"]*" method="\w+" srcip=(?P<src_ip>[\d.]+) srcintf="[^"]*" srcintfrole="[^"]*" dstip=(?P<dst_ip>[\d.]+)
    where:
      src_ip: is_private
    technique: T1021
    technique_name: Remote Services
    tactic: Lateral Movement
    weight: 7
  - id: R101
    name: Password guessing against one account
    type: threshold
    source: endpoint
    seen_in_sample: false
    match: event="login_failure"
    technique: T1110.001
    technique_name: Password Guessing
    tactic: Credential Access
    weight: 5
    group_by:
    - user
    - src_ip
    count: 20
    window: 300
    where:
      user: 'ne:'
      src_ip: 'ne:'
  - id: R102
    name: Password spraying from one source IP
    type: distinct_threshold
    source: endpoint
    seen_in_sample: false
    match: event="login_failure"
    technique: T1110.003
    technique_name: Password Spraying
    tactic: Credential Access
    weight: 5
    group_by:
    - src_ip
    distinct: user
    count: 10
    window: 300
    where:
      user: 'ne:'
      src_ip: 'ne:'
  - id: R110
    name: Successful login from external IP
    type: match
    source: endpoint
    seen_in_sample: false
    match: event="login_success"
    technique: T1078
    technique_name: Valid Accounts
    tactic: Initial Access
    weight: 7
    where:
      src_ip: not_private
      status: eq:success
  - id: R111
    name: Successful remote login from internal host
    type: match
    source: endpoint
    seen_in_sample: false
    match: event="login_success"
    technique: T1021
    technique_name: Remote Services
    tactic: Lateral Movement
    weight: 5
    where:
      src_ip: is_private
      remote: eq:true
      status: eq:success
  - id: R120
    name: Network service discovery across distinct destination ports
    type: distinct_threshold
    source: endpoint
    seen_in_sample: false
    match: event="flow"
    technique: T1046
    technique_name: Network Service Discovery
    tactic: Discovery
    weight: 5
    group_by:
    - src_ip
    - dst_ip
    distinct: dst_port
    count: 15
    window: 60
    where:
      src_ip: 'ne:'
      dst_ip: 'ne:'
      dst_port: '>0'
  - id: R130
    name: Local account creation recorded by endpoint
    type: match
    source: endpoint
    seen_in_sample: false
    match: event="account_create"
    technique: T1136.001
    technique_name: Local Account
    tactic: Persistence
    weight: 7
    where:
      status: eq:success
      account_scope: eq:local
  - id: R131
    name: Local account creation command observed
    type: match
    source: endpoint
    seen_in_sample: false
    match: event="process".* command_kind="account_create"
    technique: T1136.001
    technique_name: Local Account
    tactic: Persistence
    weight: 6
    where:
      status: eq:success
  - id: R140
    name: Sudo command targeting root observed
    type: match
    source: endpoint
    seen_in_sample: false
    match: sudo_root="true"
    technique: T1548.003
    technique_name: Sudo and Sudo Caching
    tactic: Privilege Escalation
    weight: 5
    where:
      status: eq:success
  - id: R141
    name: Special privileges assigned at Windows logon (review context)
    type: match
    source: endpoint
    seen_in_sample: false
    match: event="privileged_logon"
    technique: T1078
    technique_name: Valid Accounts
    tactic: Privilege Escalation
    weight: 2
  - id: R150
    name: Archive creation command observed
    type: match
    source: endpoint
    seen_in_sample: false
    match: event="process".* command_kind="archive"
    technique: T1560
    technique_name: Archive Collected Data
    tactic: Collection
    weight: 5
    where:
      status: eq:success
  - id: R160
    name: Potential exfiltration - large outbound transfer
    type: match
    source: endpoint
    seen_in_sample: false
    match: event="flow"
    technique: T1041
    technique_name: Exfiltration Over C2 Channel
    tactic: Exfiltration
    weight: 9
    where:
      src_ip: is_private
      dst_ip: not_private
      bytes: '>99999999'
      status: in:success,accept,allow
  - id: R170
    name: Periodic small outbound application traffic (possible beacon)
    type: periodic
    source: endpoint
    seen_in_sample: false
    match: event="flow".* bytes="(?P<small_bytes>\d+)"
    technique: T1071
    technique_name: Application Layer Protocol
    tactic: Command and Control
    weight: 5
    group_by:
    - src_ip
    - dst_ip
    - dst_port
    - protocol
    count: 10
    window: 3600
    min_interval: 5
    max_interval: 600
    max_jitter: 0.2
    where:
      src_ip: is_private
      dst_ip: not_private
      bytes: '>0'
      dst_port: '>0'
      protocol: in:http,https,dns
      status: in:success,accept,allow
      small_bytes: <4097
  - id: R180
    name: Windows audit log cleared
    type: match
    source: endpoint
    seen_in_sample: false
    match: event="log_clear"
    technique: T1070.001
    technique_name: Clear Windows Event Logs
    tactic: Defense Evasion
    weight: 7
  - id: R181
    name: Shell history cleared
    type: match
    source: endpoint
    seen_in_sample: false
    match: event="process".* command_kind="history_clear"
    technique: T1070.003
    technique_name: Clear Command History
    tactic: Defense Evasion
    weight: 6
    where:
      status: eq:success
  - id: R182
    name: Event log clear command observed
    type: match
    source: endpoint
    seen_in_sample: false
    match: event="process".* command_kind="windows_log_clear"
    technique: T1070.001
    technique_name: Clear Windows Event Logs
    tactic: Defense Evasion
    weight: 7
    where:
      status: eq:success
  - id: R052
    name: Periodic small outbound HTTP HTTPS or DNS flows (possible beacon)
    type: periodic
    source: fortigate
    seen_in_sample: false
    match: srcip=(?P<src_ip>[\d.]+) srcport=\d+ srcintf="[^"]*" srcintfrole="[^"]*" dstip=(?P<dst_ip>[\d.]+) dstport=(?P<dst_port>\d+) .*?action="(?P<action>[^"]+)".*?sentbyte=(?P<bytes>[1-9]\d*)
    technique: T1071
    technique_name: Application Layer Protocol
    tactic: Command and Control
    weight: 5
    prefilter: type="traffic"
    group_by:
    - src_ip
    - dst_ip
    - dst_port
    count: 10
    window: 3600
    min_interval: 5
    max_interval: 600
    max_jitter: 0.2
    where:
      src_ip: is_private
      dst_ip: not_private
      bytes: <4097
      dst_port: in:80,443,53
      action: in:accept,close,client-rst,server-rst
  - id: R183
    name: Linux log removal or vacuum command observed
    type: match
    source: endpoint
    seen_in_sample: false
    match: event="process".* command_kind="linux_log_clear"
    technique: T1070.002
    technique_name: Clear Linux or Mac System Logs
    tactic: Defense Evasion
    weight: 6
    where:
      status: eq:success
  - id: R132
    name: Account creation with unresolved local or domain scope
    type: match
    source: endpoint
    seen_in_sample: false
    match: event="account_create"
    technique: T1136
    technique_name: Create Account
    tactic: Persistence
    weight: 6
    where:
      account_scope: eq:unknown
      status: eq:success
  - id: R133
    name: Domain account creation recorded by endpoint
    type: match
    source: endpoint
    seen_in_sample: false
    match: event="account_create"
    technique: T1136.002
    technique_name: Domain Account
    tactic: Persistence
    weight: 6
    where:
      account_scope: eq:domain
      status: eq:success
